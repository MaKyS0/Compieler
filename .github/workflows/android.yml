name: Build Android APK

# Builds the offline app (Python/C++/JavaScript run on the phone) and publishes it as a GitHub Release asset
# named Compieler.apk. Run it from the Actions tab ("Run workflow") or push a tag like v1.0.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with: { name: Compieler-apk, path: dist/Compieler.apk }
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest build' }}
          body: "Offline Android app. Install Compieler.apk (allow installs from this source). Python, C++ and JavaScript run on the device."
          files: dist/Compieler.apk
